name: Build

# The player is .NET Framework 4.7.2 + WPF, which only builds on Windows. This
# workflow is the build machine: every push is compiled by a real Windows
# toolchain, so a rebranding change that breaks the build is caught here rather
# than on a shop's PC.

on:
  push:
    branches: [displax]
  pull_request:
    branches: [displax]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # The project uses PackageReference, so restore is an MSBuild target
      # rather than a separate nuget.exe call.
      - name: Restore NuGet packages
        run: msbuild XiboClient.sln -t:restore -p:Configuration=Release -p:Platform="Any CPU"

      - name: Build
        run: msbuild XiboClient.sln -t:build -p:Configuration=Release -p:Platform="Any CPU" -m

      # XiboClient.XmlSerializers.dll is generated by SGEN and MUST ship next to
      # the executable: without it, XmlSerializer emits a temporary assembly at
      # startup, which Smart App Control blocks (HRESULT 0xD0000003). Fail here
      # rather than discover it on a locked-down machine.
      - name: Verify the XML serializers assembly was produced
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path bin\Release -Filter *.XmlSerializers.dll -ErrorAction SilentlyContinue
          if (-not $dll) {
            Write-Error "No .XmlSerializers.dll in bin\Release — the build would crash on Smart App Control machines."
            exit 1
          }
          Write-Host "Found $($dll.Name)"

      # The player starts its own watchdog from
      # <player folder>\watchdog\x86\<Product>Watchdog.exe (Control/WatchDogManager.cs).
      # That call is guarded by File.Exists and logs NOTHING when the file is
      # missing, so a payload without the watchdog produces a player that looks
      # fine and never recovers from a freeze — the one job the watchdog has.
      # The watchdog lives in its own repository, so it is built here and staged
      # into the payload rather than left to a second installer.
      - name: Check out the watchdog
        uses: actions/checkout@v4
        with:
          repository: Cristofferson/displax-player-watchdog
          ref: displax
          path: watchdog-src

      # That project is still on packages.config, so restore is a nuget.exe call
      # and not an MSBuild target like the player's.
      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore the watchdog packages
        run: nuget restore watchdog-src\XiboClientWatchdog.sln

      - name: Build the watchdog
        run: msbuild watchdog-src\XiboClientWatchdog.sln -t:build -p:Configuration=Release -m

      - name: Stage the watchdog where the player looks for it
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path watchdog-src\bin -Recurse -Filter DISPLAXWatchdog.exe |
            Select-Object -First 1
          if (-not $exe) {
            Write-Error "DISPLAXWatchdog.exe was not produced — the player would run unsupervised."
            exit 1
          }
          $dest = 'bin\Release\watchdog\x86'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          # Its dependencies (Trove.Nini) and the .config travel with it.
          Copy-Item -Path (Join-Path $exe.Directory.FullName '*') -Destination $dest -Recurse -Force
          # The path below is built by WatchDogManager.Start(); a typo here is
          # silent at runtime, so it is an error here instead.
          if (-not (Test-Path "$dest\DISPLAXWatchdog.exe")) {
            Write-Error "The watchdog is not at $dest\DISPLAXWatchdog.exe — the player would not find it."
            exit 1
          }
          Write-Host "Watchdog staged at $dest"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: displax-player-release
          path: bin/Release/
          if-no-files-found: error

      # Los ~310 archivos y ~350 MB de arriba no se reparten a mano a nueve
      # tiendas. Este paso los convierte en un unico instalador, que es lo que
      # de verdad se descarga y se lleva a la sucursal.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          # La version sale del ensamblado recien compilado, para que lo que
          # anuncia Agregar o quitar programas coincida siempre con el binario.
          $v = (Get-Item bin\Release\DisplaxPlayer.exe).VersionInfo.FileVersion
          if (-not $v) { $v = '4.407.0' }
          Write-Host "Empaquetando version $v"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$v" `
            "/DPayloadDir=$(Resolve-Path bin\Release)" `
            installer\displax-player.iss

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: DISPLAX-Player-Setup
          path: dist/DISPLAX-Player-Setup.exe
          if-no-files-found: error
